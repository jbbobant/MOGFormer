# Install once with:  uv run pre-commit install
# Run over everything: uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      # The registry is the guard against two implementations of one concept.
      # It fails on a stale ARCHITECTURE.md and on any duplicated symbol name.
      - id: symbol-registry
        name: symbol registry is current and free of duplicates
        entry: uv run python -m utils.build_registry --check
        language: system
        pass_filenames: false
        files: ^(src/mogformer|utils)/.*\.py$

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^(src/mogformer|utils)/.*\.py$
