# TCGA-BRCA, five-class PAM50 subtyping.
#
# Every setting a run depends on lives here rather than in code. In particular
# `exclude_classes` is stated explicitly even when empty: a silently defaulted
# cohort is what previously desynchronised the baselines from the transformer.
name: tcga_5class
results_dir: results/runs

data:
  raw_dir: data/raw
  rna_file: data_rna_seq_v2_rsem.csv
  cnv_file: data_cnv.csv
  methy_file: data_methylation450.csv
  clin_file: data_clinical.csv
  label_col: SUBTYPE
  # Keep every labelled patient. Set to [BRCA_Normal] for the four-class run,
  # which stays paired because folds are remapped rather than regenerated.
  exclude_classes: []
  curated_genes_file: data/raw/CGenes.txt

folds:
  path: results/folds.json
  n_splits: 5
  n_repeats: 5
  seed: 42

preprocess:
  top_k: 250
  active_modalities: [rna, cnv, methy]
  mad_on_log_rna: false
  impute: true

graph:
  ppi_file: data/clean/9606.protein.links.v12.0.txt
  alias_file: data/clean/9606.protein.aliases.v12.0.txt
  grn_file: data/clean/collectri_signed_edges.tsv
  string_threshold: 400
  max_distance: 10
  pe_dim: 32
  pe_method: rwpe
  use_grn: false

model:
  d: 128
  mini_heads: 4
  global_heads: 8
  global_layers: 1
  dropout: 0.2
  rna_dropout_prob: 0.4
  cnv_dropout_prob: 0.2
  meth_dropout_prob: 0.2
  attention_bias_mode: inside
  numerical_tokenizer: mlp
  unimodal_dropout_fill: zero
  gene_id_embedding: false
  lambda_gate: false
  fusion_type: attention

train:
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  max_epochs: 300
  patience: 40
  batch_size: 32
  inner_val_frac: 0.2
  focal_gamma: 2.0
  log_every: 1
  seed: 42
