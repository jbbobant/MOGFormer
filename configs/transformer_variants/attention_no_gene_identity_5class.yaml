# Attention fusion without a gene-identity embedding, five-class.
#
# Genes are then told apart only by their graph positional encoding and
# shortest-path profile. Differs from learned_embedding_mask_5class.yaml in
# `gene_id_embedding` (off) and `unimodal_dropout_fill` (zero).
name: transformer_attention_no_gene_identity_5class
results_dir: results/runs/transformer_variants

data:
  raw_dir: data
  rna_file: raw/data_rna_seq_v2_rsem.csv
  cnv_file: raw/data_cnv.csv
  methy_file: raw/data_methylation_M.csv
  clin_file: clean/data_clinical.csv
  label_col: SUBTYPE
  exclude_classes: []
  curated_genes_file: data/raw/CGenes.txt

folds:
  path: data/clean/folds.json
  n_splits: 5
  n_repeats: 5
  seed: 42

preprocess:
  top_k: 250
  active_modalities: [rna, cnv, methy]
  mad_on_log_rna: false
  impute: true

graph:
  ppi_file: data/clean/9606.protein.links.v12.0.txt
  alias_file: data/clean/9606.protein.aliases.v12.0.txt
  grn_file: data/clean/collectri_signed_edges.tsv
  string_threshold: 400
  max_distance: 10
  pe_dim: 32
  pe_method: rwpe
  use_grn: false

model:
  d: 128
  mini_heads: 4
  global_heads: 8
  global_layers: 1
  dropout: 0.2
  rna_dropout_prob: 0.4
  cnv_dropout_prob: 0.2
  meth_dropout_prob: 0.2
  attention_bias_mode: inside
  numerical_tokenizer: mlp
  unimodal_dropout_fill: zero
  gene_id_embedding: false
  lambda_gate: false
  fusion_type: attention

train:
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  max_epochs: 300
  patience: 40
  batch_size: 32
  inner_val_frac: 0.2
  focal_gamma: 2.0
  log_every: 10
  seed: 42
