# TCGA-BRCA, outcome-blind masked multi-omics pretraining.
#
# Read from the TCGA bundle (`--bundle data/bundle/tcga`): the self-supervised
# cohort archive (cohort_ssl.npz, absolute copy number), each patient's ploidy
# (ploidy.csv) and the STRING edges rebuilt from experimental and database
# evidence only. Every choice below is described in configs/ssl/README.md.
name: tcga_ssl_encoder
results_dir: results/experiments/ssl_pretraining

data:
  raw_dir: data/bundle/tcga
  cohort_file: cohort_ssl.npz
  ploidy_file: ploidy.csv
  cohort_rule: >-
    every TCGA-BRCA patient with gene-level absolute copy number, RNA-seq
    expression and promoter methylation (748); no label required, so 99
    patients outside the 949-patient supervised cohort are included
  label_col: SUBTYPE
  exclude_classes: []
  curated_genes_file: curated_genes.txt

preprocess:
  # 2000 variance-ranked genes if one run stays under about four hours,
  # otherwise 1000; the curated list is added on top either way.
  top_k: 1000
  active_modalities: [rna, cnv, methy]
  mad_on_log_rna: true
  impute: true
  rna_scale: counts
  # log2(CN / ploidy), clipped to [-2, 2]: blind to a uniform genome doubling.
  cnv_representation: ploidy_relative
  clip_z: 5.0

graph:
  edges_file: string_edges_experimental_database.tsv
  grn_file: collectri_signed_edges.tsv
  string_threshold: 400
  max_distance: 4
  pe_dim: 32
  pe_method: rwpe
  use_grn: true
  weighted_pe: true

model:
  d: 128
  mini_heads: 4
  global_heads: 8
  global_layers: 3
  dropout: 0.2
  attention_bias_mode: inside
  lambda_gate: true
  fusion_type: gated
  mask_gene_frac: 0.15
  mask_modality_frac: 0.15
  mask_modality_weights: [2.0, 1.0, 1.0]
  global_offset: false
  isolated_token: true

train:
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  max_epochs: 600
  patience: 60
  batch_size: 32
  log_every: 10
  seed: 42
  gate_lr_multiplier: 10.0
  warmup_epochs: 20
  lr_schedule: cosine
  per_modality_loss: true
  monitor_frac: 0.12
  heldout_frac: 0.10
  split_seed: 42
  n_readout_masks: 10
