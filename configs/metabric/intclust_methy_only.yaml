# METABRIC, integrative cluster, derived jointly from copy number and expression
# (Curtis et al. 2012); cluster 4 is split by ER status, giving 11 classes; features: methylation only.
#
# Every setting apart from the cohort, the label and the active modalities
# is copied from configs/tcga.yaml, except that methylation is read as
# M-values, as in the TCGA transformer runs. All four modality subsets of a target
# share one partition (the target's folds.json), so their per-fold scores
# are paired.
name: metabric_intclust_methy_only
results_dir: results/runs

data:
  raw_dir: data
  rna_file: METABRIC/clean/data_rna_common.csv
  cnv_file: METABRIC/clean/data_cnv_common.csv
  methy_file: METABRIC/clean/gene_promoter_methylation_common_M.csv
  clin_file: METABRIC/clean/data_clinical.csv
  label_col: INTCLUST
  exclude_classes: []
  curated_genes_file: data/raw/CGenes.txt

folds:
  path: data/bundle/metabric/intclust/folds.json
  n_splits: 5
  n_repeats: 5
  seed: 42

preprocess:
  top_k: 250
  active_modalities: [methy]
  mad_on_log_rna: false
  impute: true
  # METABRIC expression is distributed as microarray z-scores, so it is
  # standardised as it is rather than log-transformed like counts.
  rna_scale: log

graph:
  ppi_file: data/clean/9606.protein.links.v12.0.txt
  alias_file: data/clean/9606.protein.aliases.v12.0.txt
  grn_file: data/clean/collectri_signed_edges.tsv
  string_threshold: 400
  max_distance: 10
  pe_dim: 32
  pe_method: rwpe
  use_grn: false

model:
  d: 128
  mini_heads: 4
  global_heads: 8
  global_layers: 1
  dropout: 0.2
  rna_dropout_prob: 0.4
  cnv_dropout_prob: 0.2
  meth_dropout_prob: 0.2
  attention_bias_mode: inside
  numerical_tokenizer: mlp
  unimodal_dropout_fill: zero
  gene_id_embedding: false
  lambda_gate: false
  fusion_type: attention

train:
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  max_epochs: 300
  patience: 40
  batch_size: 32
  inner_val_frac: 0.2
  focal_gamma: 2.0
  log_every: 1
  seed: 42
